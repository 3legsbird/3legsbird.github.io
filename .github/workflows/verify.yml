name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate the source-of-truth data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('identity.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('projects.json','utf8'))"
          echo "identity.json + projects.json parse OK"

      - name: Generate site (llms.txt, IDENTITY.md, sitemap.xml, HTML regions)
        run: npm run build:site

      - name: Identity answers must stay deterministic
        run: npm test

      - name: Generated files must be committed
        run: |
          if [ -n "$(git status --porcelain llms.txt IDENTITY.md sitemap.xml index.html identity.html)" ]; then
            echo "::error::Generated files are out of sync. Run 'npm run build:site' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "generated files are in sync with identity.json + projects.json"

      - name: Report catalog size
        run: |
          node -e "const p=require('./projects.json');console.log(p.projects.length+' projects, '+p.categories.length+' categories')"
